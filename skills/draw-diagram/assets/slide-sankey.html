<!-- 양의 흐름 장표 (sankey). 이 주석은 지워도 된다.
  - 단계를 지날 때마다 건수가 얼마나 남고, 어디로 갈라지고, 얼마나 빠지는지가 핵심일 때 쓴다. 띠 굵기가 양이다.
  - 한 줄이 흐름 하나다: "보내는 곳, 받는 곳, 값". 값은 숫자만 쓰고 단위는 data-unit에 둔다(예: data-unit="건").
  - 지금 볼 흐름 1~2개만 끝에 ", hl", 빠지는 양·오류 같은 진짜 문제는 ", bad"를 붙인다. 나머지는 회색이다.
  - node는 10개까지. 작은 흐름은 "기타"로 묶는다. 같은 이름은 같은 node다.
  - Mermaid sankey-beta는 쓰지 않는다. 색을 회색으로 맞출 수 없고 글자가 작다. 이 블록은 slide.js가 그린다.
-->

</pre>
</div>
