<!-- 막대 장표 (bar). 이 주석은 지워도 된다.
  - "항목끼리 크기가 어떻게 다른가"에 답할 때 쓴다. 어느 것이 가장 큰지, 몇 배 차이인지가 핵심이다. 막대 길이가 값에 비례하고 0에서 시작한다.
    같은 값이 시간에 따라 바뀌면 slide-line.html, 단계마다 남고 빠지는 양이면 slide-sankey.html이다.
  - 한 줄이 막대 하나다: "이름, 값". 위에서 아래로 쓴 차례대로 놓는다. 보통 큰 것부터 쓴다.
    천 단위는 1200이나 1_200으로 쓴다. 쉼표는 칸을 나눈다. 값은 0 이상이다.
  - 지금 볼 막대 1~2개만 끝에 ", hl", 기준을 넘은 진짜 문제는 ", bad"를 붙인다.
  - 기준선 한 줄(선택): "| 값, 이름"으로 세로 점선을 긋는다(예: | 500, 목표).
  - 단위는 블록에 data-unit="ms"처럼 둔다. 값은 막대 끝에 적고 눈금은 그리지 않는다.
  - 막대는 10줄까지. 넘치면 작은 것을 "기타"로 묶거나 장표를 나눈다.
  - Mermaid xychart는 쓰지 않는다. 색을 회색으로 맞출 수 없고 글자가 작다. 이 블록은 slide.js가 그린다.
-->
