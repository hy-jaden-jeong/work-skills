<!-- 사건 순서 장표 (Mermaid timeline). 이 주석은 지워도 된다.
  - 언제 무엇이 일어나는지, 그 차례가 핵심일 때 쓴다. 칸 간격은 실제 시간에 비례하지 않는다.
    "얼마나 걸리나", "겹치나"처럼 길이가 중요하면 slide-timebar.html을 쓴다.
  - 한 줄이 한 칸이다: "시점 : 일어난 일". 한 시점에 일이 여럿이면 다음 줄을 ": 일" 로 시작한다.
  - 시점에 콜론(:)을 쓰면 문법 오류가 난다. 02:00 대신 02시, 2시 30분처럼 쓴다.
  - 칸 폭은 고정이고 줄은 공백에서만 바뀐다. 밑줄로 이은 긴 이름(job·table 이름)은 칸 밖으로 넘치므로 user_activity_<br>daily_report처럼 나눌 곳에 <br>을 넣는다. <br>은 공백으로 바뀌어, 칸이 모자랄 때 그 자리에서 줄이 바뀐다.
  - 칸은 6개 안팎. 지금 볼 칸 1~2개만 시점 뒤에 :::hl, 진짜 문제는 :::bad 를 붙인다(예: 03시 :::hl : 적재).
  - section을 쓰면 색이 section 단위로 칠해진다. 그때는 section 줄에 :::hl 을 붙인다.
-->
<h1>{{제목: 이 장표의 결론 한 문장}}</h1>
<p class="subtitle">{{부제: 어느 날 무엇을 따라갔는지. 지어낸 시각이면 (가상)}}</p>

<div class="diagram">
<pre class="mermaid">
timeline

    02시 40분 : 정제
    03시 30분 :::hl : 집계
                    : 검색 index 적재
    05시 : 리포트 메일
</pre>
</div>
<div class="panel">
<p class="key">{{그래서: 그림을 보고 가져갈 한두 문장. 공백 빼고 90자까지}}</p>
</div>
