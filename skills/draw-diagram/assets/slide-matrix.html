<!-- 비교표 장표 (matrix). 이 주석은 지워도 된다.
  - "선택지마다 무엇이 되나"에 답할 때 쓴다: 선택지 3~4개를 기준 3~6개로 견준다. 칸 답이 ✓/✕나 짧은 글이다.
    두 방식을 그림으로 나란히 보이려면 slide-compare.html, 두 기준 위의 위치가 중요하면 slide-quadrant.html이다.
  - row가 기준, column이 선택지다. 첫 column은 기준 이름이다.
  - 답: ✓, ✕(td class="no"로 흐리게), 또는 짧은 글. 이유 한 줄은 <small>로 아래에 붙인다(18px).
  - 추천하거나 이 장에서 볼 선택지 column 하나를 <col class="hl">로 칠한다. colgroup의 col 수는 column 수와 같게 쓴다.
-->
