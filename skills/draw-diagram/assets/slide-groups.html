<!-- 묶음 장표 (상자). 두세 영역을 나란히 두고 각 영역 안에 항목을 세로로 쌓는다. 이 주석은 지워도 된다.
  - 이름이 비슷한데 사는 곳이 다른 것을 가를 때 쓴다. Mermaid subgraph는 이 배치에서 글자가 작아진다.
  - 묶음(.group) 2개가 기본. 3개면 class="columns three". 묶음 사이에 연결을 두려면 class="columns bridge"로 하고
    두 묶음 사이에 <div class="link">⇄<small>무엇으로 이어지는지</small></div>를 넣는다. 4개 이상은 장표를 나눈다.
  - 상자(.card)의 첫 <b>는 제목 줄. 상자는 색 없이 두고, 지금 볼 상자 1~2개만 hl, 진짜 문제만 bad로 칠한다.
    한두 단어만 눈에 띄게 하려면 <span class="text-bad">처럼 글자색만 바꾼다.
  - 묶음 아래로 흐름이 이어지면 <div class="link">↓<small>설명</small></div>와 <div class="card wide">를 둔다.
-->
<h1>{{제목: 이 장표의 결론 한 문장}}</h1>
<p class="subtitle">{{부제: 무엇을 예로 들었는지, 언제 무엇으로 확인했는지}}</p>
<div class="stage">
<div class="diagram">
 <div class="columns">
  <div class="group"><h3>{{묶음 A: 어디인지}}</h3>
   <div class="card hl"><b>{{항목 이름}}</b>{{짧은 딱지}}</div>
   <div class="card"><b>{{항목 이름}}</b>{{짧은 딱지}}</div>
  </div>
  <div class="group"><h3>{{묶음 B: 어디인지}}</h3>
   <div class="card"><b>{{항목 이름}}</b>{{짧은 딱지}} · <span class="text-bad">{{눈에 띄어야 할 말}}</span></div>
   <div class="card"><b>{{항목 이름}}</b>{{짧은 딱지}}</div>
  </div>
 </div>
 <div class="link">↓<small>{{무엇이 흘러가는지}}</small></div>
 <div class="card wide"><b>{{결과}}</b>{{짧은 딱지}}</div>
</div>
<div class="panel">
<p class="key">{{그래서: 그림을 보고 가져갈 한두 문장. 공백 빼고 90자까지}}</p>
</div>
</div>
<p class="source"><b>근거</b> {{코드 위치(path:line)·문서. 없으면 이 줄을 지운다}}</p>
