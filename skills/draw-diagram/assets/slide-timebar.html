<!-- 시간 막대 장표 (timebar). 이 주석은 지워도 된다.
  - 무엇이 언제 시작해 얼마나 걸리는지, 서로 겹치거나 기다리는지가 핵심일 때 쓴다. 막대 길이가 실제 시간에 비례한다.
    차례만 중요하면 slide-timeline.html을 쓴다.
  - 한 줄이 막대 하나다: "이름, 시작, 끝". 끝은 시각 대신 +30m, +2h 처럼 길이로 써도 된다.
    시각은 02:30처럼 쓰고, 끝이 시작보다 이르면 자정을 넘긴 것으로 본다. 다음 날 시각에서 시작하는 막대는 25:00(다음 날 01:00)처럼 24를 더해 쓴다. 눈금에는 01:00으로 나온다.
  - 시각 대신 숫자로 쓸 수도 있다(예: 계약, 0, 18). 그때는 단위를 data-unit에 둔다(예: data-unit="개월").
  - 기준선은 "| 시각, 이름" 줄로 긋는다(예: | 06:00, 업무 시작).
  - 막대는 9줄까지. 지금 볼 막대 1~2개만 끝에 ", hl", 늦음·실패 같은 진짜 문제는 ", bad"를 붙인다.
  - Mermaid gantt는 쓰지 않는다. 눈금 글자가 겹치고 작다. 이 블록은 slide.js가 그린다.
-->
