<!-- 2x2 장표 (quadrant). 이 주석은 지워도 된다.
  - "두 기준으로 놓으면 선택지가 어디에 서나"에 답할 때 쓴다. 칸 안에서 치우친 정도까지 보여야 할 때다.
    기준이 셋 이상이거나 ✓/✕로 답이 갈리면 slide-matrix.html(비교표)이다.
  - 축 두 줄: "x: 낮은 쪽 -> 높은 쪽", "y: 낮은 쪽 -> 높은 쪽". 위·오른쪽이 높은 쪽이다.
  - 사분면 이름(선택): "오른쪽 위: 이름", "왼쪽 위: …", "왼쪽 아래: …", "오른쪽 아래: …". 필요한 칸만 쓴다.
  - 점 한 줄: "이름, x, y" 또는 끝에 ", hl". x·y는 0~100이다. 8개까지. 이름이 겹치면 좌표를 조금 옮긴다.
  - Mermaid quadrantChart는 쓰지 않는다. 점 이름이 12px로 작고 점마다 칠할 수 없다. 이 블록은 slide.js가 그린다.
-->
