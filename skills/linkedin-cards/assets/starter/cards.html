<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>주문 운영 카드 예제 (가상)</title><link rel="stylesheet" href="cards.css"></head>
<body>
<!-- Generic fictional examples. Replace claims, data and sources for actual use. -->
<section class="card dark" data-safe="72" aria-label="자동 처리 비율">
  <p class="eyebrow">주문 운영 · 가상 data</p>
  <h1 data-readable>주문 10건 중 7건은<br>자동으로 처리된다</h1>
  <p class="condition">가상 주문 1,000건 · 처리 완료 기준</p>
  <figure class="chart" aria-label="자동 70%, 수동 30%의 구성비">
    <p class="big-value" data-readable>70%</p>
    <p class="chart-label" data-readable>자동 처리</p>
    <div class="stack"><span class="sage" style="width:70%" data-readable>자동 70%</span><span class="blue" style="width:30%" data-readable>수동 30%</span></div>
  </figure>
  <footer class="source"><span>출처: 제작 예제(가상) · n=1,000</span><span>01</span></footer>
</section>
<section class="card" data-safe="72" aria-label="대기 시간 비교">
  <p class="eyebrow">같은 기준의 비교 · 가상 data</p>
  <h2 data-readable>B 방식의 대기 시간은<br>A보다 4분 짧다</h2>
  <p class="condition">같은 주문 유형 · 평균 대기 시간(분)<br>방식별 n=100 · 가상 비교</p>
  <figure class="chart" aria-label="A 방식 10분, B 방식 6분, 공통 0에서 12분 축">
    <div class="bar-group"><div class="value-row"><span data-readable>A 방식</span><span data-readable>10분</span></div><div class="track"><div class="bar blue" style="width:83.333333%"></div></div></div>
    <div class="bar-group"><div class="value-row"><span data-readable>B 방식</span><span data-readable>6분</span></div><div class="track"><div class="bar sage" style="width:50%"></div></div></div>
    <div class="axis"><span>0</span><span>6</span><span>12분</span></div>
  </figure>
  <footer class="source"><span>출처: 제작 예제(가상) · 집단별 n=100</span><span>02</span></footer>
</section>
<section class="card dark" data-safe="72" aria-label="예외 처리 흐름">
  <p class="eyebrow">처리 흐름 · 개념도</p>
  <h2 data-readable>예외만 검토한 뒤<br>처리 결과를 기록한다</h2>
  <p class="condition">가상 운영 설계 · 수량을 나타내지 않음</p>
  <figure class="chart flow" aria-label="예외 감지, 담당자 검토, 결과 기록의 순서">
    <div class="step" data-readable>예외 감지</div><div class="arrow" aria-hidden="true">↓</div>
    <div class="step" data-readable>담당자 검토</div><div class="arrow" aria-hidden="true">↓</div>
    <div class="step" data-readable>결과 기록</div>
  </figure>
  <footer class="source"><span>출처: 제작 예제(가상 설계)</span><span>03</span></footer>
</section>
</body></html>
