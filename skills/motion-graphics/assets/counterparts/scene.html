<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>DE와 FDE의 주된 협업 상대 (가상)</title>
<style>
html,body{margin:0;width:1080px;height:1350px;background:#11151b;overflow:hidden}
svg{display:block;width:1080px;height:1350px;font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}
text{font-weight:500}
</style>
<svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="같은 배송 지연 주문에서 DE의 데이터 전문 직군과 FDE의 실무자 책임자 협업"></svg>
<script>
/* 시각 storyboard: 출발점은 동일한 배송 지연 주문 A-104다(모든 값은 가상).
   DE 0–8.7s: 날짜 → +2일 계산 → 데이터 row → MLE/DS/분석가가 쓰는 산출물.
   FDE 9–17s: 같은 주문 → 실무자/책임자와 조치 연결 → 조치 상태가 업무 기록에 반영.
   끝에는 주문과 실행 기록을 유지한다. '주된' 협업이며 배타적 역할/우열이 아니다.
   이 사례의 DE 산출물도 같은 배송 문제에 쓰인다. 데이터 소비자 작업을 보여 주되
   모델 성능, 원인 분석 결과, 처리 속도 같은 검증되지 않은 결과는 만들지 않는다. */
const BG='#11151b', PANEL='#1b222d', LINE='#455063', BLUE='#8fb6ff', WARM='#dbac83';
const shipment={id:'A-104',promised:'12/02',arrived:'12/04',delayDays:2};
const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)},lerp=(a,b,p)=>a+(b-a)*p;
const text=(x,y,s,size=36,color='#edf1f7',anchor='start')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="${anchor}">${s}</text>`;
const box=(x,y,w,h,fill=PANEL,stroke=LINE,r=16)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
const check=(x,y,color=BLUE)=>`<path d="M${x-13} ${y}l10 11l22 -26" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
const line=(x1,y1,x2,y2,c=LINE)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${c}" stroke-width="3" fill="none"/>`;
function person(x,y,name,active=false){const c=active?BLUE:LINE;return `<circle cx="${x}" cy="${y-29}" r="23" stroke="${c}" stroke-width="4" fill="${BG}"/><path d="M${x-40} ${y+29}q0 -37 40 -37q40 0 40 37" stroke="${c}" stroke-width="4" fill="none"/>`+text(x,y+81,name,35,'#edf1f7','middle');}
function parcel(x,y){return `<path d="M${x} ${y-42}l49 -23l49 23v73l-49 24l-49 -24Z M${x} ${y-42}l49 24l49 -24 M${x+49} ${y-18}v73" fill="none" stroke="${WARM}" stroke-width="4"/>`;}
function rowCard(x,y,title){return box(x-140,y,280,145,'#202b3a',BLUE,12)+text(x,y-22,title,32,'#aeb9c8','middle')+line(x-140,y+63,x+140,y+63)+line(x+8,y,x+8,y+145)+text(x-57,y+43,'ID',30,'#aeb9c8','middle')+text(x+74,y+43,'지연',30,'#aeb9c8','middle')+text(x-66,y+110,'A-104',33,'#edf1f7','middle')+text(x+76,y+110,'+2일',36,BLUE,'middle');}
function renderAt(time){
 const t=Math.max(0,Math.min(20,Number(time)||0)),fde=t>=9,u=fde?t-9:t;
 const fade=fde?ease(u/.5):1-ease((t-8.45)/.55),derived=!fde&&t>=3.65,distributed=!fde&&t>=6.2;
 const informed=fde&&u>=3.7,followup=fde&&u>=6.45,recorded=fde&&u>=8;
 let svg=box(0,0,1080,1350,BG,BG,0)+text(80,109,'DE / FDE',54)+text(80,165,'배송 지연 주문 · (가상)',34,'#aeb9c8');
 // The shipment remains fixed through the comparison; only the collaboration changes.
 svg+=box(80,305,920,196)+parcel(111,406)+text(242,375,'주문',32,'#aeb9c8')+text(242,433,shipment.id,43);
 svg+=text(487,375,'예정',32,'#aeb9c8')+text(487,433,shipment.promised,43)+text(758,375,'도착',32,'#aeb9c8')+text(758,433,shipment.arrived,43,WARM);
 svg+=`<g opacity="${fade}">`+box(80,214,920,64,'#202a38',LINE,16)+text(108,258,`${fde?'FDE':'DE'} · 주된 협업 상대`,40,fde?WARM:BLUE);
 if(!fde){
   const tableAlpha=ease((u-1.3)/.6);svg+=`<g opacity="${tableAlpha}">`+text(80,561,'배송 데이터',36)+box(80,582,920,153,PANEL,LINE,10);
   [310,540,770].forEach(x=>svg+=line(x,582,x,735));svg+=line(80,648,1000,648);
   ['order_id','예정','도착','지연'].forEach((h,i)=>svg+=text(195+i*230,627,h,34,'#aeb9c8','middle'));
   [shipment.id,shipment.promised,shipment.arrived,derived?'+2일':'—'].forEach((v,i)=>svg+=text(195+i*230,705,v,40,i===3&&derived?BLUE:'#edf1f7','middle'));
   svg+='</g>';
   if(u>2.65&&u<3.65){const p=ease((u-2.65)),x=lerp(825,885,p),y=lerp(473,695,p);svg+=box(x-82,y-41,164,72,'#293b53',BLUE,10)+text(x,y+11,'+2일',40,BLUE,'middle');}
   const targets=[230,540,850],arrival=ease((u-4.3)/1.9);
   targets.forEach((x,i)=>{
     svg+=line(885,750,885,774)+line(230,774,885,774)+line(x,774,x,790);
     if(arrival>0&&arrival<1){const xx=lerp(885,x,arrival),yy=lerp(695,943,arrival);svg+=box(xx-71,yy-35,142,64,'#293b53',BLUE,10)+text(xx,yy+10,'+2일',36,BLUE,'middle');}
     svg+=`<g opacity="${ease((u-5.65)/.55)}">`+rowCard(x,849,['학습 데이터','분석 데이터','지연 현황'][i])+`</g>`;
     svg+=person(x,1115,['MLE','DS','분석가'][i],distributed)+line(x,1008,x,1060,distributed?BLUE:LINE);
   });
 }else{
   const boardAlpha=ease((u-.65)/.65);svg+=`<g opacity="${boardAlpha}">`+text(80,560,'A-104 · 주문 대응',36);
   [656,796].forEach((y,i)=>{
     const done=i?followup:informed;
     svg+=box(80,y-60,920,120,PANEL,done?BLUE:LINE,14)+box(119,y-20,42,42,'#151b24',done?BLUE:LINE,6);
     svg+=text(202,y+13,['고객 안내','보상 검토'][i],40);
     svg+=text(877,y+13,done?(i?'승인됨':'안내 완료'):'확인 대기',36,done?BLUE:'#aeb9c8','middle');if(done)svg+=check(139,y+1);
   });svg+='</g>';
   const actors=[{x:170,name:'FDE'},{x:510,name:'주문 실무자'},{x:870,name:'업무 책임자'}];
   actors.forEach((a,i)=>svg+=person(a.x,1115,a.name,i===0?u>=1.2:i===1?informed:followup));
   svg+=line(170,1035,170,971)+line(170,971,870,971)+line(510,971,510,1035)+line(870,971,870,1035);
   // Action objects travel to the relevant counterpart and return as recorded states.
   const flights=[{start:1.5,end:3.7,x:510,label:'고객 안내'},{start:4.25,end:6.45,x:870,label:'보상 검토'}];
   flights.forEach((f,i)=>{
     if(u>=f.start&&u<f.end){const p=ease((u-f.start)/(f.end-f.start)),half=p<.5?p*2:(1-p)*2,x=lerp(557,f.x,half),y=lerp(656+i*140,1010,half);svg+=box(x-130,y-31,260,70,'#293b53',BLUE,10)+text(x,y+16,f.label,36,'#edf1f7','middle');if(p>=.5)svg+=check(x+103,y+3);}
   });
   if(recorded)svg+=box(80,1210,920,68,'#213148',BLUE,15)+check(128,1244)+text(180,1256,'A-104 · 대응 완료',40);
 }
 svg+='</g>'+text(540,1310,'업무·팀에 따라 협업 범위는 겹칠 수 있음',30,'#aeb9c8','middle');
 document.getElementById('canvas').innerHTML=svg;
 return {phase:fde?(recorded?'workflow-complete':followup?'compensation-approved':informed?'customer-informed':'workflow-collaboration'):(distributed?'data-distributed':derived?'delay-derived':'shipment-data'),objectIDs:['shipment:A-104','delay-row:A-104','DE','MLE','DS','analyst','FDE','order-operator','business-owner','action:customer-notice','action:compensation-review'],values:{shipment,delayRow:derived||fde?{order_id:'A-104',delayDays:2}:null},counterparts:fde?['order-operator','business-owner']:['MLE','DS','analyst'],dataDistributed:distributed,actions:{customerNotice:informed?'complete':'pending',compensationReview:followup?'approved':'pending'},recorded};
}
window.renderAt=renderAt;renderAt(0);
</script></html>
